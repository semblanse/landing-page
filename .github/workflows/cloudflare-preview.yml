name: Deploy Cloudflare preview

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check tests, types and lint
        run: npm test && npm run typecheck && npm run lint
      - name: Build and deploy preview
        run: node scripts/deploy-preview.mjs
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAFVI311hWIdh2XKl"
          PREVIEW_BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a9d5eec9230d19166842a42f1580d558
